set-option -g default-shell /bin/zsh

# True color passthrough (required for 24-bit hex themes in Claude Code etc.)
set -g default-terminal "tmux-256color"
set -g terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,*:RGB"
set-environment -g COLORTERM truecolor
set-environment -g FORCE_COLOR 3
set-environment -gu TERMINFO

# Ensure we use zsh for mac
set-option -g default-command "unset TERMINFO; TERM_PROGRAM=ghostty COLORTERM=truecolor FORCE_COLOR=3 reattach-to-user-namespace -l zsh"

# Status bar - inherit terminal background from Ghostty
set -g status-style bg=default,fg="#7a4030"
set -g window-status-current-style bg=default,fg="#e8643a",bold
set -g window-status-style bg=default,fg="#7a4030"
set -g menu-style "bg=default,fg=#c4643a"
set -g pane-border-style fg="#1a0f0a"
set -g pane-active-border-style fg="#1a0f0a"
set -g message-style bg=default,fg="#f5a623"

# Pane content inherits terminal background (fixes black fill in apps like Claude Code)
set -g window-style 'bg=#1a0f0a'
set -g window-active-style 'bg=#1a0f0a'
set -g mouse on
set -g renumber-windows on
set-option -g allow-rename off
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format '#{b:pane_current_path}'
set -g @continuum-restore 'on'
set -g status-interval 5
set -g status-right '#(~/.tmux/scripts/battery_bar.sh)  %H:%M'

# Second status line showing all sessions (disabled)
# set -g status 2
# set -g status-format[1] '#[align=left]#(bash ~/.tmux/scripts/session-list-status.sh)'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Ensure there's enough space for session names and status
set -g status-left-length 40
set -g status-right-length 60

bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{tmux_pane_current_path}"

bind c new-window -c "#{pane_current_path}"

# Swap window position left/right
bind-key -r < swap-window -d -t -1
bind-key -r > swap-window -d -t +1

# Cycle current window down one index (with loop)
bind-key f run-shell "bash ~/.tmux/scripts/cycle-window.sh"

# Toggle Alacritty theme with Ctrl+b T
bind-key T run-shell "~/.config/alacritty/toggle-theme.sh"

bind-key s choose-tree -Zs

# New session with random icon
bind-key N command-prompt -p "New session name:" "run-shell 'bash ~/.tmux/scripts/new-session-with-icon.sh new \"%%\"'"

# Command modal - opens a new tmux pane as a floating window, press ESC to close
bind-key m display-popup -h 20 -w 120 -x C -y C "$SHELL"

# World time zones
bind-key t display-popup -h 16 -w 60 -x C -y C "bash ~/.tmux/scripts/world-time.sh"

# Cycle to next session
bind-key L switch-client -n

# Repeat last pomodoro
bind-key p run-shell "pomodoro --directory '$HOME/repos/visions/misc/pomodoro' repeat 2>/dev/null"

# Reload tmux config
bind-key R source-file ~/.tmux.conf \; display-message "Config reloaded"
